<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INA & UGG 家帳收支存摺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEBDD;
    --paper-line:#DCD5BE;
    --navy:#1F3350;
    --navy-deep:#152438;
    --gold:#B08D4F;
    --gold-soft:#D8C79A;
    --seal-red:#A63D33;
    --seal-red-soft:#E7D3CE;
    --jade:#3B6E5E;
    --jade-soft:#D6E3DD;
    --ink:#26241F;
    --ink-soft:#635C4C;
    --white:#FBFAF5;
    --radius:14px;
    --shadow:0 6px 20px rgba(31,51,80,.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(180deg, rgba(176,141,79,.05) 0px, rgba(176,141,79,.05) 1px, transparent 1px, transparent 34px);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Hero : 存摺封面 ---------- */
  .cover{
    background:linear-gradient(155deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-radius:18px;
    padding:30px 32px 26px;
    color:var(--white);
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .cover::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 88% -10%, rgba(216,199,154,.18), transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 40px);
    pointer-events:none;
  }
  .cover-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .cover-eyebrow{
    font-size:11px; letter-spacing:.28em; color:var(--gold-soft); text-transform:uppercase;
    border:1px solid rgba(216,199,154,.4); padding:4px 10px; border-radius:999px; display:inline-block;
  }
  .cover-title{
    font-family:'Noto Serif TC', serif; font-weight:900; font-size:26px; margin:14px 0 2px;
    letter-spacing:.04em;
  }
  .cover-sub{color:rgba(251,250,245,.6); font-size:13px;}
  .month-nav{display:flex; align-items:center; gap:10px; position:relative;}
  .month-nav button{
    background:rgba(251,250,245,.1); border:1px solid rgba(251,250,245,.25); color:var(--white);
    width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:15px;
    display:flex;align-items:center;justify-content:center; transition:.15s;
  }
  .month-nav button:hover{background:rgba(251,250,245,.22);}
  .today-btn{
    background:rgba(251,250,245,.1); border:1px solid rgba(251,250,245,.25); color:var(--white);
    padding:0 12px; height:32px; border-radius:8px; cursor:pointer; font-size:12.5px; font-weight:600;
    transition:.15s; white-space:nowrap;
  }
  .today-btn:hover{background:rgba(251,250,245,.22);}
  .month-nav .label{
    font-family:'Noto Serif TC',serif; font-size:15px; min-width:100px; width:auto; height:auto;
    padding:6px 10px; text-align:center;
  }
  .month-picker{
    display:none; gap:8px; position:absolute; top:42px; right:0; z-index:6;
    background:var(--white); border-radius:10px; padding:10px; box-shadow:var(--shadow);
  }
  .month-picker.open{display:flex;}
  .month-picker select{
    padding:7px 9px; border-radius:7px; border:1px solid var(--paper-line); background:var(--paper);
    font-size:13px; color:var(--ink); font-family:'Noto Sans TC', sans-serif;
  }

  .cover-figure{
    margin-top:22px; padding-top:18px; border-top:1px dashed rgba(216,199,154,.35);
    display:flex; align-items:flex-end; justify-content:flex-end; flex-wrap:wrap; gap:14px;
  }
  .cover-figure .amount{
    font-size:38px; font-weight:700; letter-spacing:.02em;
  }
  .cover-figure .amount-label{font-size:12px; color:var(--gold-soft); letter-spacing:.1em;}
  .add-btn{
    background:var(--gold); color:var(--navy-deep); border:none; border-radius:10px;
    padding:11px 18px; font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 4px 12px rgba(176,141,79,.4); transition:.15s;
  }
  .add-btn:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(176,141,79,.5);}

  /* ---------- 印章 / 債務區 ---------- */
  .seal-row{display:flex; gap:16px; margin-top:20px; flex-wrap:wrap;}
  .seal-card{
    flex:1; min-width:260px;
    background:var(--white); border-radius:var(--radius); padding:20px 22px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:18px;
    cursor:pointer; transition:.15s; border:1px solid transparent;
  }
  .seal-card:hover{box-shadow:0 10px 26px rgba(31,51,80,.16); border-color:var(--gold-soft);}
  .seal-stamp{
    width:64px; height:64px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:900; font-size:13px; text-align:center; line-height:1.15;
    border:2.5px solid currentColor; position:relative; letter-spacing:.02em;
  }
  .seal-stamp::after{
    content:""; position:absolute; inset:5px; border:1px solid currentColor; border-radius:50%; opacity:.5;
  }
  .seal-stamp.owe{color:var(--seal-red); background:var(--seal-red-soft);}
  .seal-stamp.owed{color:var(--jade); background:var(--jade-soft);}
  .seal-stamp.even{color:var(--ink-soft); background:#EDEAE0;}
  .seal-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; justify-content:center;}
  .seal-main--simple{gap:0;}
  .seal-text .t1{font-size:12px; color:var(--ink-soft); letter-spacing:.05em;}
  .seal-text .t2{font-family:'Noto Serif TC',serif; font-size:21px; font-weight:700; margin-top:4px;}
  .seal-text .t2 .val{font-family:'JetBrains Mono',monospace;}
  .settle-btn{
    align-self:flex-start; background:none; border:1px solid var(--paper-line); color:var(--ink-soft);
    padding:7px 12px; border-radius:8px; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .settle-btn:hover{border-color:var(--ink-soft); color:var(--ink);}

  .section-title{
    font-family:'Noto Serif TC',serif; font-size:15px; font-weight:700; margin:30px 0 12px;
    display:flex; align-items:center; gap:8px; color:var(--navy);
  }
  .section-title::before{content:""; width:6px; height:6px; background:var(--gold); border-radius:1px; transform:rotate(45deg);}

  /* ---------- 月曆 ---------- */
  .cal{background:var(--white); border-radius:var(--radius); padding:18px 18px 8px; box-shadow:var(--shadow);}
  .cal-week{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--ink-soft); padding-bottom:8px; border-bottom:1px solid var(--paper-line); margin-bottom:8px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-cell{
    min-height:90px; border-radius:10px; padding:7px 6px; cursor:pointer; position:relative;
    border:1px solid transparent; transition:.12s;
  }
  .cal-cell:hover{border-color:var(--gold-soft); background:#FBF8EF;}
  .cal-cell.empty{cursor:default;}
  .cal-cell.empty:hover{border-color:transparent; background:none;}
  .cal-cell.today{background:var(--jade-soft);}
  .cal-day-num{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .cal-cell.today .cal-day-num{color:var(--jade);}
  .cal-day-sum{font-size:11px; margin-top:20px; text-align:right;}
  .cal-day-amounts{margin-top:10px; text-align:right; line-height:1.5;}
  .cal-amt{font-size:10px; font-weight:700; letter-spacing:.01em;}
  .cal-amt.ina{color:var(--seal-red);}
  .cal-amt.ugg{color:var(--jade);}
  .cal-dots{position:absolute; left:7px; bottom:8px; display:flex; gap:3px;}
  .dot{width:5px; height:5px; border-radius:50%;}
  .dot.expense{background:var(--navy);}
  .dot.debt{background:var(--seal-red);}

  /* ---------- Modal 內月份導覽（明細欄月份選擇） ---------- */
  .modal-month-nav{display:flex; align-items:center; gap:6px; position:relative;}
  .modal-month-nav button.mm-arrow{
    background:var(--paper); border:1px solid var(--paper-line); color:var(--navy);
    width:26px; height:26px; border-radius:7px; cursor:pointer; font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .modal-month-nav button.mm-arrow:hover{background:var(--gold-soft);}
  .modal-month-nav .mm-label{
    font-family:'Noto Serif TC',serif; font-size:13px; background:none; border:none; cursor:pointer;
    color:var(--navy); padding:4px 6px; border-radius:6px;
  }
  .modal-month-nav .mm-label:hover{background:var(--paper);}
  .modal-month-picker{
    display:none; gap:6px; position:absolute; top:34px; right:0; z-index:10;
    background:var(--white); border-radius:10px; padding:9px; box-shadow:var(--shadow);
  }
  .modal-month-picker.open{display:flex;}
  .modal-month-picker select{
    padding:6px 8px; border-radius:7px; border:1px solid var(--paper-line); background:var(--paper);
    font-size:12.5px; color:var(--ink); font-family:'Noto Sans TC', sans-serif;
  }

  /* ---------- 結清日期／方式 標記 ---------- */
  .settle-meta{font-size:11px; color:var(--jade); margin-top:1px;}

  /* ---------- 結清方式表單 Modal ---------- */
  .settle-summary{
    background:var(--paper); border-radius:10px; padding:12px 14px; margin-bottom:16px;
    font-size:13px; color:var(--ink-soft); line-height:1.6;
  }
  .settle-summary b{color:var(--navy);}
  .method-toggle{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .method-toggle button{
    flex:1; min-width:80px; padding:9px; border-radius:9px; border:1.5px solid var(--paper-line); background:none;
    font-size:13px; cursor:pointer; color:var(--ink-soft); font-weight:600;
  }
  .method-toggle button.active{border-color:var(--jade); color:var(--jade); background:var(--jade-soft);}

  /* ---------- 循環代墊欄位 ---------- */
  .recurring-toggle{
    display:flex; align-items:center; gap:8px; margin:2px 0 14px; padding:9px 11px;
    background:var(--paper); border-radius:9px; cursor:pointer; font-size:13px; color:var(--ink);
  }
  .recurring-toggle input{width:16px; height:16px; accent-color:var(--jade); cursor:pointer;}
  .recurring-fields{display:none; padding:2px 0 4px;}
  .recurring-fields.show{display:block;}
  .recurring-tag{
    display:inline-block; font-size:10.5px; color:var(--jade); background:var(--jade-soft);
    padding:1px 6px; border-radius:6px; margin-left:5px; vertical-align:middle;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,26,38,.55); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--white); border-radius:16px; width:100%; max-width:440px;
    max-height:86vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    padding:18px 20px; border-bottom:1px solid var(--paper-line); display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; background:var(--white);
  }
  .modal-head h3{margin:0; font-family:'Noto Serif TC',serif; font-size:17px; color:var(--navy);}
  .modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;}
  .modal-body{padding:16px 20px 22px;}

  .tx-item{
    display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--paper-line);
  }
  .tx-item:last-child{border-bottom:none;}
  .tx-icon{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto;}
  .tx-icon.type-expense{background:#E7E2D3;}
  .tx-icon.type-debt{background:var(--seal-red-soft);}
  .tx-mid{flex:1; min-width:0;}
  .tx-mid .name{font-size:13.5px; font-weight:500;}
  .tx-mid .meta{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .tx-amt{font-size:13.5px; text-align:right; white-space:nowrap;}
  .tx-actions{display:flex; gap:4px; margin-left:4px;}
  .tx-actions button{
    border:none; background:none; cursor:pointer; font-size:13px; color:var(--ink-soft); padding:4px;
  }
  .tx-actions button:hover{color:var(--seal-red);}
  .tx-actions button.tx-undo-btn{color:var(--gold);}
  .tx-actions button.tx-undo-btn:hover{color:var(--navy);}
  .tx-empty{padding:26px 0; text-align:center; color:var(--ink-soft); font-size:13px;}

  /* ---------- 本月收支明細 Modal ---------- */
  .summary-group-title{
    font-family:'Noto Serif TC',serif; font-size:13px; font-weight:700; color:var(--navy);
    margin:18px 0 4px; display:flex; align-items:center; gap:6px;
  }
  .summary-group-title::before{content:""; width:5px; height:5px; background:var(--gold); border-radius:1px; transform:rotate(45deg);}
  .day-add{
    width:100%; margin-top:14px; padding:11px; border:1.5px dashed var(--gold); border-radius:10px;
    background:none; color:var(--navy); font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .day-add:hover{background:#FBF6E9;}

  /* ---------- Form ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; letter-spacing:.02em;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--paper-line); border-radius:8px;
    font-family:inherit; font-size:13.5px; background:var(--paper); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:50px;}
  .type-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .type-toggle button{
    flex:1; padding:9px; border-radius:9px; border:1.5px solid var(--paper-line); background:none;
    font-size:13px; cursor:pointer; color:var(--ink-soft); font-weight:600;
  }
  .type-toggle button.active.et-expense{border-color:var(--navy); color:var(--navy); background:#EEF1F5;}
  .type-toggle button.active.et-debt{border-color:var(--seal-red); color:var(--seal-red); background:var(--seal-red-soft);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-submit{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--navy); color:var(--white);
    font-weight:700; font-size:14px; cursor:pointer; margin-top:4px;
  }
  .form-submit:hover{background:var(--navy-deep);}
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:10px; text-align:center;}

  /* ---------- 代墊明細：分人小計 ---------- */
  .summary-subgroup{margin-bottom:6px;}
  .summary-subgroup-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; background:var(--paper); border-radius:8px; margin:10px 0 2px;
  }
  .summary-subgroup-head .sg-name{font-size:12.5px; font-weight:700; color:var(--navy);}
  .summary-subgroup-head .sg-total{font-size:12.5px; font-weight:700;}
  .summary-subgroup-head.who-ina .sg-name{color:var(--seal-red);}
  .summary-subgroup-head.who-ugg .sg-name{color:var(--jade);}

  /* ---------- Undo Toast ---------- */
  .undo-toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%, 20px);
    background:var(--navy-deep); color:var(--white); border-radius:12px;
    padding:12px 14px 12px 18px; box-shadow:0 10px 30px rgba(0,0,0,.28);
    display:flex; align-items:center; gap:14px; z-index:80;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    max-width:90vw;
  }
  .undo-toast.show{opacity:1; pointer-events:auto; transform:translate(-50%, 0);}
  .undo-toast .ut-text{font-size:13px; white-space:nowrap;}
  .undo-toast .ut-btn{
    background:var(--gold); color:var(--navy-deep); border:none; border-radius:8px;
    padding:7px 14px; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .undo-toast .ut-close{
    background:none; border:none; color:rgba(251,250,245,.6); cursor:pointer; font-size:15px; padding:2px;
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- 封面 / Hero -->
  <div class="cover">
    <div class="cover-top">
      <div>
        <span class="cover-eyebrow">Household Ledger</span>
        <div class="cover-title">INA &amp; UGG 家帳收支存摺</div>
      </div>
      <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <button class="label" id="monthLabelBtn" onclick="togglePicker(event)"></button>
        <button onclick="changeMonth(1)">›</button>
        <button class="today-btn" onclick="goToToday()">今天</button>
        <div class="month-picker" id="monthPicker">
          <select id="pickYear" onchange="jumpToPicker()"></select>
          <select id="pickMonth" onchange="jumpToPicker()"></select>
        </div>
      </div>
    </div>
    <div class="cover-figure">
      <button class="add-btn" onclick="openForm(todayStr())">＋ 新增一筆</button>
    </div>
  </div>

  <!-- 債務印章 -->
  <div class="seal-row" id="sealRow"></div>

  <!-- 月曆 -->
  <div class="section-title">月度總表</div>
  <div class="cal">
    <div class="cal-week">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="hint">＊資料已同步儲存於 Supabase 雲端資料庫，重新整理頁面不會遺失紀錄。</div>
</div>

<!-- Modal: 當日明細 -->
<div class="overlay" id="dayOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="dayModalTitle">日期明細</h3>
      <button class="modal-close" onclick="closeModal('dayOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <div id="dayTxList"></div>
      <button class="day-add" id="dayAddBtn">＋ 新增這天的紀錄</button>
    </div>
  </div>
</div>

<!-- Modal: 本月收支明細（點擊藍框卡片開啟） -->
<div class="overlay" id="summaryOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="summaryModalTitle">本月收支明細</h3>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="modal-month-nav">
          <button class="mm-arrow" onclick="changeSummaryMonth(-1)">‹</button>
          <button class="mm-label" id="summaryMonthLabel" onclick="toggleSummaryPicker(event)"></button>
          <button class="mm-arrow" onclick="changeSummaryMonth(1)">›</button>
          <div class="modal-month-picker" id="summaryMonthPicker">
            <select id="summaryPickYear" onchange="jumpSummaryPicker()"></select>
            <select id="summaryPickMonth" onchange="jumpSummaryPicker()"></select>
          </div>
        </div>
        <button class="modal-close" onclick="closeModal('summaryOverlay')">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="summaryTxList"></div>
    </div>
  </div>
</div>

<!-- Modal: 新增/編輯表單 -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="formModalTitle">新增紀錄</h3>
      <button class="modal-close" onclick="closeModal('formOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <div class="type-toggle">
        <button type="button" class="et-expense" id="btnTypeExpense" onclick="setFormType('expense')">代墊</button>
        <button type="button" class="et-debt" id="btnTypeDebt" onclick="setFormType('debt')">借款</button>
      </div>
      <form id="txForm" onsubmit="saveTransaction(event)">
        <input type="hidden" id="fEditId">
        <input type="hidden" id="fRecurringGroup">
        <div class="field">
          <label>日期</label>
          <input type="date" id="fDate" required>
        </div>

        <div id="expenseFields">
          <div class="two-col">
            <div class="field">
              <label>分類</label>
              <select id="fCategory">
                <option value="飲食">🍜 飲食</option>
                <option value="居家">🏠 居家</option>
                <option value="交通">🚗 交通</option>
                <option value="娛樂">🎬 娛樂</option>
                <option value="醫療">💊 醫療</option>
                <option value="現金">💵 現金</option>
                <option value="其他">📎 其他</option>
              </select>
            </div>
            <div class="field">
              <label>付款人</label>
              <select id="fPayer">
                <option value="UGG">UGG</option>
                <option value="INA">INA</option>
              </select>
            </div>
          </div>

          <label class="recurring-toggle" id="recurringToggleLabel">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= Supabase 連線設定 ================= */
const SUPABASE_URL = 'https://sbeffokvaugjiokmulbz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_l5ByiaTmPOofL24JXM_GOQ_s3LofVok';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TABLE = 'transactions';

/* ================= 資料層（雲端 Supabase 儲存） ================= */
const CATEGORY_ICON = {飲食:'🍜', 居家:'🏠', 交通:'🚗', 娛樂:'🎬', 醫療:'💊', 現金:'💵', 其他:'📎'};

function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function todayStr(){return fmtDate(new Date());}
function money(n){return 'NT$ ' + Number(n).toLocaleString('zh-Hant-TW');}

const today = new Date();
const Y = today.getFullYear(), M = today.getMonth();

let transactions = [];
let viewYear = Y, viewMonth = M;
let currentDayStr = null;
let formType = 'expense';
let loading = true;

// 「一鍵結清」復原機制：暫存結清前的一瞬間狀態（id -> 原本的 status）
let lastSettledIds = [];
let undoToastTimer = null;

/* 固定復原按鈕：只要該筆紀錄目前是「已結清」，任何人、任何時候都能點擊復原（不依賴當次瀏覽器狀態） */
function undoBtnHtml(t){
  if(t.status!=='settled') return '';
  return `<button class="tx-undo-btn" title="復原這一筆結清" onclick="undoSettleOne(${t.id})">↺</button>`;
}

/* ---- 從 Supabase 讀取全部紀錄 ---- */
async function loadTransactions(){
  const { data, error } = await sb.from(TABLE).select('*').order('date', {ascending:true});
  if(error){
    console.error(error);
    alert('讀取資料失敗，請確認 Supabase 資料表與連線設定是否正確：\n' + error.message);
    loading = false;
    return;
  }
  transactions = data || [];
  loading = false;
  renderAll();
  if(currentDayStr && document.getElementById('dayOverlay').classList.contains('open')){
    renderDayList();
  }
}

/* ================= 渲染 ================= */
function renderAll(){
  renderHero();
  renderSeal();
  renderCalendar();
}

function monthTxFor(y, m){
  const prefix = `${y}-${pad(m+1)}`;
  return transactions.filter(t => t.date.startsWith(prefix));
}
function monthTx(){
  return monthTxFor(viewYear, viewMonth);
}

function renderHero(){
  document.getElementById('monthLabelBtn').textContent = `${viewYear} 年 ${viewMonth+1} 月`;
}

function netDebtForMonth(y, m){
  // 正值代表「UGG」欠「INA」；負值代表「INA」欠「UGG」
  // 「代墊」與「借款」合併計算為該月最終互欠金額（每月分別結清，因此只看該月未結清紀錄）：
  //   借款：出借人(lender) 借給 借款人(borrower) => borrower 欠 lender 這筆錢
  //   代墊：付款人(payer) 幫對方代墊 => 對方（非付款人）欠 payer 這筆錢
  let net = 0;
  monthTxFor(y, m).forEach(t=>{
    if(t.status === 'settled') return; // 已結清的紀錄不列入淨額計算
    if(t.type === 'debt'){
      if(t.lender==='INA' && t.borrower==='UGG') net += Number(t.amount);
      if(t.lender==='UGG' && t.borrower==='INA') net -= Number(t.amount);
    } else if(t.type === 'expense'){
      if(t.payer==='INA') net += Number(t.amount);
      if(t.payer==='UGG') net -= Number(t.amount);
    }
  });
  return net;
}

function renderSeal(){
  const net = netDebtForMonth(viewYear, viewMonth);
  const row = document.getElementById('sealRow');

  let stampClass='even', label=`${viewYear}年${viewMonth+1}月 目前互不相欠`, sub='本月帳務已結清';
  if(net > 0){ stampClass='owe'; label='本月 UGG 欠 INA'; sub = money(net); }
  else if(net < 0){ stampClass='owed'; label='本月 INA 欠 UGG'; sub = money(-net); }

  row.innerHTML = `
    <div class="seal-card" onclick="openSummaryModal()">
      <div class="seal-stamp ${stampClass}">${net===0 ? '結清' : '欠款'}</div>
      <div class="seal-main seal-main--simple">
        <div class="seal-text">
          <div class="t1">本月淨債務餘額</div>
          <div class="t2">${label}${net!==0 ? ' <span class="val">'+sub+'</span>' : ''}</div>
        </div>
      </div>
      ${net!==0 ? '<button class="settle-btn" onclick="event.stopPropagation(); settleAll()">一鍵結清本月</button>' : ''}
    </div>`;
}

/* ================= 一鍵結清（僅限單一月份） ================= */
let pendingSettleList = [];
let pendingSettleMethod = '匯款';

function settleAll(){
  // 只結清「目前檢視月份」尚未結清的紀錄，符合每月分別結清的規則
  pendingSettleList = monthTx().filter(t=>t.status!=='settled');
  if(pendingSettleList.length===0) return;
  openSettleModal(viewYear, viewMonth, pendingSettleList);
}

function openSettleModal(y, m, list){
  pendingSettleList = list;
  const totalExpense = list.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const totalDebt = list.filter(t=>t.type==='debt').reduce((s,t)=>s+Number(t.amount),0);
  document.getElementById('settleSummaryText').innerHTML =
    `即將結清 <b>${y} 年 ${m+1} 月</b> 共 <b>${list.length}</b> 筆未結清紀錄<br>`+
    `（代墊 ${money(totalExpense)}・借款 ${money(totalDebt)}）`;
  pendingSettleMethod = '匯款';
  document.querySelectorAll('#methodToggle button').forEach(b=>b.classList.toggle('active', b.dataset.v==='匯款'));
  document.getElementById('settleDate').value = todayStr();
  document.getElementById('settleNote').value = '';
  document.getElementById('settleOverlay').classList.add('open');
}

function pickSettleMethod(v){
  pendingSettleMethod = v;
  document.querySelectorAll('#methodToggle button').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
}

async function confirmSettle(e){
  e.preventDefault();
  if(pendingSettleList.length===0){ closeModal('settleOverlay'); return; }

  const settleDate = document.getElementById('settleDate').value;
  const note = document.getElementById('settleNote').value;
  const settleMethod = note ? `${pendingSettleMethod}・${note}` : pendingSettleMethod;
  const ids = pendingSettleList.map(t=>t.id);

  const { error } = await sb.from(TABLE)
    .update({ status:'settled', settle_date: settleDate, settle_method: settleMethod })
    .in('id', ids);
  if(error){
    console.error(error);
    alert('結清失敗：' + error.message + '\n（若欄位不存在，請先在 Supabase 資料表新增 settle_date / settle_method 欄位）');
    return;
  }

  transactions.forEach(t=>{
    if(ids.includes(t.id)){ t.status='settled'; t.settle_date=settleDate; t.settle_method=settleMethod; }
  });
  lastSettledIds = ids;

  closeModal('settleOverlay');
  renderAll();
  if(document.getElementById('summaryOverlay').classList.contains('open')) renderSummaryList();
  if(document.getElementById('dayOverlay').classList.contains('open')) renderDayList();
  showUndoToast(ids.length);
}

/* ---- 復原（Undo）：把結清的紀錄狀態改回原本的狀態 ---- */
function showUndoToast(count){
  if(count<=0){ hideUndoToast(); return; }
  const toast = document.getElementById('undoToast');
  document.getElementById('undoToastText').textContent = `已結清 ${count} 筆紀錄`;
  toast.classList.add('show');
  if(undoToastTimer) clearTimeout(undoToastTimer);
  // 10 秒後自動隱藏提示（但每一筆紀錄的復原按鈕仍會保留，直到下一次結清才會覆蓋）
  undoToastTimer = setTimeout(hideUndoToast, 10000);
}

function hideUndoToast(){
  document.getElementById('undoToast').classList.remove('show');
  if(undoToastTimer){ clearTimeout(undoToastTimer); undoToastTimer=null; }
}

/* 復原「剛才那次一鍵結清」的所有紀錄（來自結清提示 Toast） */
async function undoSettle(){
  if(!lastSettledIds || lastSettledIds.length===0){
    hideUndoToast();
    return;
  }
  await revertSettledIds(lastSettledIds);
  lastSettledIds = [];
  hideUndoToast();
}

/* 復原單獨一筆紀錄：畫面上每一筆已結清明細都會固定顯示「復原」按鈕，
   不論當初是誰、在哪個裝置上按下結清，任何人隨時都能點擊復原。 */
async function undoSettleOne(id){
  await revertSettledIds([id]);
  lastSettledIds = lastSettledIds.filter(x=>x!==id);
  if(lastSettledIds.length===0) hideUndoToast();
  else document.getElementById('undoToastText').textContent = `已結清 ${lastSettledIds.length} 筆紀錄`;
}

/* 共用的復原動作：把指定 id 清單的紀錄改回「未結清」，並清除結清方式／結清日期 */
async function revertSettledIds(ids){
  const { error } = await sb.from(TABLE)
    .update({ status:'unpaid', settle_date:null, settle_method:null })
    .in('id', ids);
  if(error){
    console.error(error);
    alert('復原失敗：' + error.message);
    return;
  }
  transactions.forEach(t=>{
    if(ids.includes(t.id)){ t.status='unpaid'; t.settle_date=null; t.settle_method=null; }
  });
  renderAll();
  if(document.getElementById('summaryOverlay').classList.contains('open')) renderSummaryList();
  if(document.getElementById('dayOverlay').classList.contains('open')) renderDayList();
}

/* ================= Modal：本月收支明細（藍框卡片） ================= */
/* 明細彈窗自己的年月狀態，可獨立於首頁月曆切換瀏覽不同月份的明細 */
let summaryYear = Y, summaryMonth = M;

function settleMetaHtml(t){
  if(t.status!=='settled') return '';
  const d = t.settle_date ? t.settle_date.slice(5).replace('-','/') : '';
  const method = t.settle_method || '';
  const parts = [d, method].filter(Boolean).join('・');
  return `<div class="settle-meta">✓ 已結清${parts?'・'+parts:''}</div>`;
}

function recurringTagHtml(t){
  return t.recurring_group ? '<span class="recurring-tag">🔁 循環代墊</span>' : '';
}

/* 循環代墊：整組「編輯」與「刪除」按鈕（顯示在每一筆循環紀錄的操作列） */
function recurringActionsHtml(t){
  if(!t.recurring_group) return '';
  const gid = t.recurring_group;
  return `
    <button title="編輯整組循環代墊" onclick="event.stopPropagation(); openRecurringEditModal('${gid}')">🔁✎</button>
    <button title="刪除整組循環代墊" onclick="event.stopPropagation(); deleteRecurringGroup('${gid}')">🔁🗑</button>`;
}

function openSummaryModal(){
  summaryYear = viewYear; summaryMonth = viewMonth;
  renderSummaryList();
  document.getElementById('summaryOverlay').classList.add('open');
}

function changeSummaryMonth(delta){
  summaryMonth += delta;
  if(summaryMonth<0){summaryMonth=11; summaryYear--;}
  if(summaryMonth>11){summaryMonth=0; summaryYear++;}
  renderSummaryList();
}

function toggleSummaryPicker(e){
  e.stopPropagation();
  const p = document.getElementById('summaryMonthPicker');
  const willOpen = !p.classList.contains('open');
  if(willOpen){
    const ySel = document.getElementById('summaryPickYear');
    const mSel = document.getElementById('summaryPickMonth');
    ySel.innerHTML = '';
    for(let y=summaryYear-6; y<=summaryYear+6; y++){
      ySel.innerHTML += `<option value="${y}" ${y===summaryYear?'selected':''}>${y} 年</option>`;
    }
    mSel.innerHTML = '';
    for(let m=0;m<12;m++){
      mSel.innerHTML += `<option value="${m}" ${m===summaryMonth?'selected':''}>${m+1} 月</option>`;
    }
    p.classList.add('open');
  } else {
    p.classList.remove('open');
  }
}

function jumpSummaryPicker(){
  summaryYear = Number(document.getElementById('summaryPickYear').value);
  summaryMonth = Number(document.getElementById('summaryPickMonth').value);
  document.getElementById('summaryMonthPicker').classList.remove('open');
  renderSummaryList();
}

document.addEventListener('click', (e)=>{
  const picker = document.getElementById('summaryMonthPicker');
  const btn = document.getElementById('summaryMonthLabel');
  if(picker && picker.classList.contains('open') && !picker.contains(e.target) && e.target!==btn){
    picker.classList.remove('open');
  }
});

function renderSummaryList(){
  document.getElementById('summaryModalTitle').textContent = `${summaryYear} 年 ${summaryMonth+1} 月 收支明細`;
  document.getElementById('summaryMonthLabel').textContent = `${summaryYear} 年 ${summaryMonth+1} 月`;

  const list = monthTxFor(summaryYear, summaryMonth);
  const net = netDebtForMonth(summaryYear, summaryMonth);
  const expenses = list.filter(t=>t.type==='expense').slice().sort((a,b)=> a.date<b.date?1:-1);
  const debts = list.filter(t=>t.type==='debt').slice().sort((a,b)=> a.date<b.date?1:-1);

  let html = net===0
    ? `<div class="hint" style="margin:0 0 14px;">本月未結清淨額：互不相欠</div>`
    : `<div class="hint" style="margin:0 0 14px;">本月未結清淨額：${net>0?'UGG 欠 INA':'INA 欠 UGG'} ${money(Math.abs(net))}</div>`;

  html += `<div class="summary-group-title">代墊明細</div>`;

  if(expenses.length===0){
    html += `<div class="tx-empty">本月尚無代墊紀錄</div>`;
  } else {
    // 依照付款人（INA／UGG）分組，並分別計算各自代墊總額
    const renderExpenseItem = t=>{
      const settled = t.status==='settled';
      return `
      <div class="tx-item" style="${settled?'opacity:.6;':''}">
        <div class="tx-icon type-expense">${CATEGORY_ICON[t.category]||'📎'}</div>
        <div class="tx-mid">
          <div class="name">${t.category}${t.note?'・'+t.note:''}${recurringTagHtml(t)}</div>
          <div class="meta">${t.date.slice(5)}・${t.payer} 支付</div>
          ${settleMetaHtml(t)}
        </div>
        <div class="tx-amt mono">${money(t.amount)}</div>
        <div class="tx-actions">
          ${undoBtnHtml(t)}
          ${recurringActionsHtml(t)}
          <button title="編輯" onclick="openForm('${t.date}', ${t.id})">✎</button>
          <button title="刪除" onclick="deleteTx(${t.id})">🗑</button>
        </div>
      </div>`;
    };

    const renderPayerGroup = (payerName, cssClass)=>{
      const items = expenses.filter(t=>t.payer===payerName);
      if(items.length===0) return '';
      const subtotal = items.reduce((s,t)=>s+Number(t.amount),0);
      return `
        <div class="summary-subgroup">
          <div class="summary-subgroup-head ${cssClass}">
            <span class="sg-name">${payerName} 支付</span>
            <span class="sg-total mono">${money(subtotal)}</span>
          </div>
          ${items.map(renderExpenseItem).join('')}
        </div>`;
    };

    html += renderPayerGroup('INA', 'who-ina');
    html += renderPayerGroup('UGG', 'who-ugg');

    // 若有付款人不是 INA／UGG 的例外資料，仍完整顯示避免遺漏
    const others = expenses.filter(t=>t.payer!=='INA' && t.payer!=='UGG');
    if(others.length>0){
      const subtotal = others.reduce((s,t)=>s+Number(t.amount),0);
      html += `
        <div class="summary-subgroup">
          <div class="summary-subgroup-head">
            <span class="sg-name">其他</span>
            <span class="sg-total mono">${money(subtotal)}</span>
          </div>
          ${others.map(renderExpenseItem).join('')}
        </div>`;
    }
  }

  html += `<div class="summary-group-title">借款明細</div>`;
  html += debts.length===0
    ? `<div class="tx-empty">本月尚無借款紀錄</div>`
    : debts.map(t=>{
        const settled = t.status==='settled';
        return `
      <div class="tx-item" style="${settled?'opacity:.6;':''}">
        <div class="tx-icon type-debt">${CATEGORY_ICON[t.category]||'🖋'}</div>
        <div class="tx-mid">
          <div class="name">${t.lender} 借給 ${t.borrower}</div>
          <div class="meta">${t.date.slice(5)}・${t.category?t.category+'・':''}${t.note||'借款'}</div>
          ${settleMetaHtml(t)}
        </div>
        <div class="tx-amt mono">${money(t.amount)}</div>
        <div class="tx-actions">
          ${undoBtnHtml(t)}
          <button title="編輯" onclick="openForm('${t.date}', ${t.id})">✎</button>
          <button title="刪除" onclick="deleteTx(${t.id})">🗑</button>
        </div>
      </div>`;
      }).join('');

  document.getElementById('summaryTxList').innerHTML = html;
}

function renderCalendar(){
  const grid = document.getElementById('calGrid');
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  let html = '';
  for(let i=0;i<firstDay;i++) html += `<div class="cal-cell empty"></div>`;

  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${viewYear}-${pad(viewMonth+1)}-${pad(day)}`;
    const dayTx = transactions.filter(t=>t.date===dateStr);
    const inaSum = dayTx.filter(t=>t.type==='expense' && t.payer==='INA').reduce((s,t)=>s+Number(t.amount),0);
    const uggSum = dayTx.filter(t=>t.type==='expense' && t.payer==='UGG').reduce((s,t)=>s+Number(t.amount),0);
    const hasDebt = dayTx.some(t=>t.type==='debt');
    const hasExpense = dayTx.some(t=>t.type==='expense');
    const isToday = dateStr === todayStr();

    html += `
      <div class="cal-cell ${isToday?'today':''}" onclick="openDayModal('${dateStr}')">
        <div class="cal-day-num">${day}</div>
        ${(inaSum>0||uggSum>0) ? `<div class="cal-day-amounts mono">
          ${inaSum>0 ? `<div class="cal-amt ina">INA ${inaSum.toLocaleString()}</div>` : ''}
          ${uggSum>0 ? `<div class="cal-amt ugg">UGG ${uggSum.toLocaleString()}</div>` : ''}
        </div>` : ''}
        ${(hasDebt||hasExpense) ? `<div class="cal-dots">${hasExpense?'<span class="dot expense"></span>':''}${hasDebt?'<span class="dot debt"></span>':''}</div>` : ''}
      </div>`;
  }
  grid.innerHTML = html;
}

function changeMonth(delta){
  viewMonth += delta;
  if(viewMonth<0){viewMonth=11; viewYear--;}
  if(viewMonth>11){viewMonth=0; viewYear++;}
  renderAll();
}

/* 返回「今天」所在的月份 */
function goToToday(){
  viewYear = Y; viewMonth = M;
  document.getElementById('monthPicker').classList.remove('open');
  renderAll();
}

/* ---- 年份／月份快速選擇器 ---- */
function togglePicker(e){
  e.stopPropagation();
  const p = document.getElementById('monthPicker');
  const willOpen = !p.classList.contains('open');
  if(willOpen){
    const ySel = document.getElementById('pickYear');
    const mSel = document.getElementById('pickMonth');
    ySel.innerHTML = '';
    for(let y=viewYear-6; y<=viewYear+6; y++){
      ySel.innerHTML += `<option value="${y}" ${y===viewYear?'selected':''}>${y} 年</option>`;
    }
    mSel.innerHTML = '';
    for(let m=0;m<12;m++){
      mSel.innerHTML += `<option value="${m}" ${m===viewMonth?'selected':''}>${m+1} 月</option>`;
    }
    p.classList.add('open');
  } else {
    p.classList.remove('open');
  }
}

function jumpToPicker(){

  viewMonth = Number(document.getElementById('pickMonth').value);
  document.getElementById('monthPicker').classList.remove('open');
  renderAll();
}

document.addEventListener('click', (e)=>{

/* ================= Modal：當日明細 ================= */

  const [yy,mm,dd] = dateStr.split('-');

  renderDayList();
  document.getElementById('dayAddBtn').onclick = () => openForm(dateStr);
  document.getElementById('dayOverlay').classList.add('open');
}

      return `

        <div class="tx-mid">
          <div class="name">${t.category}${t.note?'・'+t.note:''}${recurringTagHtml(t)}</div>
          <div class="meta">${t.payer} 支付</div>
          ${settleMetaHtml(t)}
        </div>
        <div class="tx-amt mono">${money(t.amount)}</div>
        <div class="tx-actions">
          ${undoBtnHtml(t)}
          ${recurringActionsHtml(t)}
          <button title="編輯" onclick="openForm('${t.date}', ${t.id})">✎</button>
          <button title="刪除" onclick="deleteTx(${t.id})">🗑</button>
        </div>
      </div>`;
    } else {
      const settled = t.status==='settled';
      return `
      <div class="tx-item" style="${settled?'opacity:.6;':''}">
        <div class="tx-icon type-debt">${CATEGORY_ICON[t.category]||'🖋'}</div>
        <div class="tx-mid">
          <div class="name">${t.lender} 借給 ${t.borrower}</div>
          <div class="meta">${t.category?t.category+'・':''}${t.note||'借款'}</div>
          ${settleMetaHtml(t)}
        </div>
        <div class="tx-amt mono">${money(t.amount)}</div>
        <div class="tx-actions">

          <button title="編輯" onclick="openForm('${t.date}', ${t.id})">✎</button>
          <button title="刪除" onclick="deleteTx(${t.id})">🗑</button>

async function deleteTx(id){
  const { error } = await sb.from(TABLE).delete().eq('id', id);
  if(error){
    console.error(error);
    alert('刪除失敗：' + error.message);
    return;
  }
  transactions = transactions.filter(t=>t.id!==id);
  lastSettledIds = lastSettledIds.filter(x=>x!==id);
  if(document.getElementById('dayOverlay').classList.contains('open')) renderDayList();
  if(document.getElementById('summaryOverlay').classList.contains('open')) renderSummaryList();
  renderAll();
}

/* ================= 循環代墊：整組刪除／整組修改 ================= */

/* 一次刪除同一組循環代墊的所有紀錄 */
async function deleteRecurringGroup(groupId){
  const items = transactions.filter(t=>t.recurring_group===groupId);
  if(items.length===0) return;
  if(!confirm(`確定要刪除整組循環代墊嗎？\n共 ${items.length} 筆紀錄（含已結清）將一併刪除，此動作無法復原。`)) return;

  const { error } = await sb.from(TABLE).delete().eq('recurring_group', groupId);
  if(error){
    console.error(error);
    alert('刪除失敗：' + error.message);
    return;
  }
  const ids = items.map(t=>t.id);
  transactions = transactions.filter(t=>t.recurring_group!==groupId);
  lastSettledIds = lastSettledIds.filter(id=>!ids.includes(id));

  if(document.getElementById('dayOverlay').classList.contains('open')) renderDayList();
  if(document.getElementById('summaryOverlay').classList.contains('open')) renderSummaryList();
  renderAll();
}

/* 打開「整組修改」表單，帶入該組目前的內容作為預設值 */
let pendingRecurringGroup = null;
function openRecurringEditModal(groupId){
  const items = transactions.filter(t=>t.recurring_group===groupId);
  if(items.length===0) return;
  pendingRecurringGroup = groupId;
  const sample = items[0];

  document.getElementById('recurCount').textContent = items.length;
  document.getElementById('recurCategory').value = sample.category;
  document.getElementById('recurPayer').value = sample.payer;
  document.getElementById('recurAmount').value = sample.amount;
  document.getElementById('recurNote').value = sample.note || '';
  document.getElementById('recurIncludeSettled').checked = false;
  document.getElementById('recurringEditOverlay').classList.add('open');
}

/* 將修改套用到整組循環代墊（預設只套用到尚未結清的紀錄，可勾選一併套用到已結清紀錄） */
async function saveRecurringEdit(e){
  e.preventDefault();
  if(!pendingRecurringGroup) return;

  const category = document.getElementById('recurCategory').value;
  const payer = document.getElementById('recurPayer').value;
  const amount = Number(document.getElementById('recurAmount').value);
  const note = document.getElementById('recurNote').value;
  const includeSettled = document.getElementById('recurIncludeSettled').checked;

  let items = transactions.filter(t=>t.recurring_group===pendingRecurringGroup);
  if(!includeSettled) items = items.filter(t=>t.status!=='settled');
  if(items.length===0){
    alert('目前沒有符合條件（尚未結清）的紀錄可以修改，若要一併修改已結清的紀錄，請勾選下方選項。');
    return;
  }

  const ids = items.map(t=>t.id);
  const payload = { category, payer, amount, note };
  const { error } = await sb.from(TABLE).update(payload).in('id', ids);
  if(error){
    console.error(error);
    alert('修改失敗：' + error.message);
    return;
  }
  transactions.forEach(t=>{
    if(ids.includes(t.id)){ t.category=category; t.payer=payer; t.amount=amount; t.note=note; }
  });

  closeModal('recurringEditOverlay');
  pendingRecurringGroup = null;
  if(document.getElementById('dayOverlay').classList.contains('open')) renderDayList();
  if(document.getElementById('summaryOverlay').classList.contains('open')) renderSummaryList();
  renderAll();
}

/* ================= Modal：新增／編輯表單 ================= */

  document.getElementById('btnTypeExpense').classList.toggle('active', type==='expense');

function fillRecurringDayOptions(selectedDay){
  const sel = document.getElementById('fRecurringDay');
  sel.innerHTML = '';

    sel.innerHTML += `<option value="${d}" ${d===selectedDay?'selected':''}>${d} 號</option>`;

function toggleRecurringFields(){
  const on = document.getElementById('fRecurring').checked;

}

function openForm(dateStr, editId=null){
  document.getElementById('formOverlay').classList.add('open');
  document.getElementById('fDate').value = dateStr;
  document.getElementById('fEditId').value = editId ?? '';
  document.getElementById('fRecurringGroup').value = '';
  document.getElementById('fRecurring').checked = false;
  toggleRecurringFields();
  fillRecurringDayOptions(Number(dateStr.split('-')[2]));
  document.getElementById('fRecurringUntil').value = dateStr.slice(0,7);

  if(editId){
    const t = transactions.find(x=>x.id===editId);
    document.getElementById('formModalTitle').textContent = '編輯紀錄';
    document.getElementById('fSubmitBtn').textContent = '更新紀錄';
    setFormType(t.type);
    document.getElementById('fAmount').value = t.amount;
    document.getElementById('fNote').value = t.note || '';
    if(t.type==='expense'){
      document.getElementById('fCategory').value = t.category;
      document.getElementById('fPayer').value = t.payer;
    } else {
      document.getElementById('fLender').value = t.lender;
      document.getElementById('fBorrower').value = t.borrower;
      document.getElementById('fDebtCategory').value = t.category || '其他';
    }
    // 編輯既有紀錄時，只針對這一筆做修改，不重新設定循環規則
    document.getElementById('recurringToggleLabel').style.display = 'none';
  } else {
    document.getElementById('formModalTitle').textContent = '新增紀錄';
    document.getElementById('fSubmitBtn').textContent = '儲存紀錄';
    document.getElementById('txForm').reset();
    document.getElementById('fDate').value = dateStr;
    fillRecurringDayOptions(Number(dateStr.split('-')[2]));
    document.getElementById('fRecurringUntil').value = dateStr.slice(0,7);
    setFormType('expense');
    document.getElementById('recurringToggleLabel').style.display = 'flex';
  }
}

/* 依照「每月幾號」與「循環至」年月，從 fromDate 所在月份開始，逐月產生日期字串清單 */
function buildRecurringDates(fromDate, day, untilYearMonth){
  const [fy, fm] = fromDate.split('-').map(Number);
  const [uy, um] = untilYearMonth.split('-').map(Number);
  const dates = [];
  let y = fy, m = fm; // m 為 1~12
  while(y < uy || (y === uy && m <= um)){
    const lastDay = new Date(y, m, 0).getDate();
    const useDay = Math.min(day, lastDay); // 若該月天數不足（如 2 月沒有 30 號），自動使用當月最後一天
    dates.push(`${y}-${pad(m)}-${pad(useDay)}`);
    m++;
    if(m>12){ m=1; y++; }
  }
  return dates;
}

async function saveTransaction(e){
  e.preventDefault();
  const editId = document.getElementById('fEditId').value;
  const date = document.getElementById('fDate').value;
  const amount = Number(document.getElementById('fAmount').value);
  const note = document.getElementById('fNote').value;

  // 編輯時保留原本的結清狀態，避免每次修改都被重置回「未結清」
  const existing = editId ? transactions.find(t=>t.id===Number(editId)) : null;
  const status = existing ? (existing.status || 'unpaid') : 'unpaid';

  const isRecurring = !editId && formType==='expense' && document.getElementById('fRecurring').checked;

  function buildPayload(d){
    if(formType==='expense'){
      return {
        type:'expense', date:d, amount,
        category: document.getElementById('fCategory').value,
        payer: document.getElementById('fPayer').value,
        lender:null, borrower:null,
        note, status
      };
    }
    return {
      type:'debt', date:d, amount,
      lender: document.getElementById('fLender').value,
      borrower: document.getElementById('fBorrower').value,
      category: document.getElementById('fDebtCategory').value,
      payer:null,
      note, status
    };
  }

  const submitBtn = document.getElementById('fSubmitBtn');
  const originalText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = '儲存中…';

  if(isRecurring){
    // 循環代墊：從這筆紀錄所在月份開始，每月同一天，直到指定年月為止，批次建立多筆紀錄
    const day = Number(document.getElementById('fRecurringDay').value);
    const until = document.getElementById('fRecurringUntil').value;
    if(!until){
      submitBtn.disabled = false; submitBtn.textContent = originalText;
      alert('請選擇循環至哪一個年月');
      return;
    }
    const dates = buildRecurringDates(date, day, until);
    if(dates.length===0){
      submitBtn.disabled = false; submitBtn.textContent = originalText;
      alert('循環至的年月必須等於或晚於這筆紀錄的年月');
      return;
    }
    const groupId = 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    const payloads = dates.map(d => ({ ...buildPayload(d), recurring_group: groupId }));

    const { data, error } = await sb.from(TABLE).insert(payloads).select();
    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
    if(error){
      console.error(error);
      alert('建立循環代墊失敗：' + error.message + '\n（若欄位不存在，請先在 Supabase 資料表新增 recurring_group 欄位）');
      return;
    }
    transactions.push(...data);
  } else if(editId){
    const payload = buildPayload(date);
    const { data, error } = await sb.from(TABLE).update(payload).eq('id', Number(editId)).select().single();
    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
    if(error){ console.error(error); alert('更新失敗：' + error.message); return; }
    const idx = transactions.findIndex(t=>t.id===Number(editId));
    transactions[idx] = data;
  } else {
    const payload = buildPayload(date);
    const { data, error } = await sb.from(TABLE).insert(payload).select().single();
    submitBtn.disabled = false;
    submitBtn.textContent = originalText;
    if(error){ console.error(error); alert('新增失敗：' + error.message); return; }
    transactions.push(data);
  }

  closeModal('formOverlay');
  currentDayStr = date;
  renderAll();

  // 依照目前實際開啟的視窗刷新對應清單，而不是每次都強制開啟「當日明細」
  const dayOpen = document.getElementById('dayOverlay').classList.contains('open');
  const summaryOpen = document.getElementById('summaryOverlay').classList.contains('open');
  if(dayOpen){
    renderDayList();
  } else if(summaryOpen){
    renderSummaryList();
  } else {
    openDayModal(date);
  }
}

function closeModal(id){
  document.getElementById(id).classList.remove('open');
}
