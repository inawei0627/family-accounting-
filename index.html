<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INA-working schedule💣</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ina-glitch/workschedule/main/favicon.png">
<link rel="shortcut icon" type="image/png" href="https://raw.githubusercontent.com/ina-glitch/workschedule/main/favicon.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ina-glitch/workschedule/main/favicon.png">
<meta property="og:image" content="https://raw.githubusercontent.com/ina-glitch/workschedule/main/favicon.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://raw.githubusercontent.com/ina-glitch/workschedule/main/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2333;
    --ink-soft:#4A5164;
    --paper:#F5F6F4;
    --card:#FFFFFF;
    --muted:#8A93A6;
    --line:#E3E5E0;
    --teal:#2F6F5E;
    --teal-deep:#204F42;
    --amber:#E2A63B;
    --amber-bg:#FCF2DE;
    --red:#C6413A;
    --red-bg:#FBE7E5;
    --low-bg:#EDF1EF;
    --weekend-bg:#ECEDEC;
    --note-bg:#ECEDF1;
    --note-text:#5B6472;
    --note-line:#C7CCD6;
    --hold-bg:#E7E9F2;
    --hold-text:#565F82;
    --hold-line:#C9CEE0;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,35,51,0.04), 0 4px 14px rgba(28,35,51,0.05);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
    min-height:100vh;
  }

  .topbar{
    border-bottom:1px solid var(--line);
    background:var(--card);
    padding:22px 28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:-0.01em;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    display:inline-block;
    width:10px;height:10px;
    background:var(--teal);
    border-radius:2px;
    transform:rotate(45deg);
  }
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:400;
    color:var(--muted);
    letter-spacing:0.02em;
  }
  .stat-strip{
    display:flex;
    gap:22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .stat-strip b{
    font-size:16px;
    font-family:'Space Grotesk',sans-serif;
    color:var(--ink);
    display:block;
    line-height:1.1;
  }
  .stat-strip .stat{ min-width:52px; }
  .stat-strip .stat.warn b{ color:var(--red); }

  .layout{
    display:grid;
    grid-template-columns:320px 1fr 300px;
    gap:0;
    align-items:start;
    max-width:1620px;
    margin:0 auto;
  }

  /* ---- work summary sidebar ---- */
  .summary-sidebar{
    border-right:1px solid var(--line);
    padding:28px 20px;
    position:sticky;
    top:73px;
    height:calc(100vh - 73px);
    overflow-y:auto;
  }

  /* ---- right sidebar (this week meetings / trips) ---- */
  .summary-sidebar-right{
    border-left:1px solid var(--line);
    padding:28px 20px;
    position:sticky;
    top:73px;
    height:calc(100vh - 73px);
    overflow-y:auto;
  }

  /* ---- form panel (now rendered inside a modal) ---- */
  .panel{
    padding:2px 2px 4px;
  }
  .modal-box.task-modal-box{ max-width:460px; }
  .task-modal-box .modal-head{ align-items:flex-start; }
  .panel h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 4px;
  }
  .panel .hint{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 22px;
  }
  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:0.01em;
  }
  .field textarea,
  .field input,
  .field select{
    width:100%;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:7px;
    padding:9px 11px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input[type="date"]{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }
  .field input[type="date"]:disabled{
    background:var(--paper);
    color:var(--muted);
  }
  .field textarea{
    resize:vertical;
    min-height:64px;
    font-family:'Inter',sans-serif;
  }
  .field textarea:focus,
  .field input:focus,
  .field select:focus{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(47,111,94,0.12);
  }
  .field .row{ display:flex; gap:8px; align-items:center; }
  .field .row input[type="date"]{ flex:1; }
  .field .row button{
    flex:none;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--teal-deep);
    background:var(--low-bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    cursor:pointer;
  }
  .field .row button:hover{ background:#dfe9e5; }

  .unlimited-toggle{
    flex:none;
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    font-weight:500;
    color:var(--ink-soft);
    white-space:nowrap;
    cursor:pointer;
  }
  .unlimited-toggle input[type="checkbox"]{
    width:auto;
    accent-color:var(--teal);
    cursor:pointer;
  }

  .urgency-picker{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .urgency-picker input{ display:none; }
  .urgency-picker label{
    text-align:center;
    padding:8px 2px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
    background:var(--card);
    transition:all .15s ease;
  }
  .urgency-picker input:checked + label.u-top{ background:var(--red-bg); border-color:var(--red); color:var(--red); }
  .urgency-picker input:checked + label.u-high{ background:var(--amber-bg); border-color:var(--amber); color:#8a6415; }
  .urgency-picker input:checked + label.u-normal{ background:var(--low-bg); border-color:var(--teal); color:var(--teal-deep); }
  .urgency-picker input:checked + label.u-note{ background:var(--note-bg); border-color:var(--note-line); color:var(--note-text); }

  .submit-btn{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:7px;
    padding:12px 0;
    font-size:13.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-top:6px;
    transition:background .15s ease;
  }
  .submit-btn:hover{ background:var(--teal-deep); }
  .cancel-edit-btn{
    width:100%;
    background:var(--card);
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px 0;
    font-size:12.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-top:8px;
    transition:background .15s ease;
  }
  .cancel-edit-btn:hover{ background:var(--low-bg); }
  .panel.editing{ box-shadow:inset 3px 0 0 var(--teal); }

  /* ---- main list ---- */
  .main{ padding:28px 28px 60px; }
  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .list-head h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    margin:0;
  }
  .controls-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* ---- grouped secondary filters ---- */
  .filter-bar{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    padding:12px 14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:9px;
    margin-bottom:8px;
  }
  .filter-group{ display:flex; align-items:center; gap:8px; }
  .filter-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    white-space:nowrap;
  }
  .filter-reset{
    margin-left:auto;
    border:1px solid transparent;
    background:transparent;
    color:var(--red);
    font-size:12px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    padding:5px 8px;
    border-radius:6px;
  }
  .filter-reset:hover{ background:var(--red-bg); }
  .filter-summary{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    margin:0 0 16px 2px;
  }
  .filter-summary b{ color:var(--ink-soft); }

  /* ---- list view ---- */
  .list-view-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .list-view-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }

  .add-task-btn{
    border:none;
    background:var(--ink);
    color:#fff;
    border-radius:7px;
    padding:0 16px;
    height:32px;
    font-size:12.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:background .15s ease;
  }
  .add-task-btn:hover{ background:var(--teal-deep); }
  .add-task-btn.loan-btn{ background:#1B6E8C; }
  .add-task-btn.loan-btn:hover{ background:#144F65; }

  .seg{
    display:flex;
    border:1px solid var(--line);
    border-radius:7px;
    overflow:hidden;
    background:var(--card);
  }
  .seg button{
    border:none;
    background:transparent;
    padding:7px 12px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    cursor:pointer;
    border-right:1px solid var(--line);
    white-space:nowrap;
  }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--ink); color:#fff; }

  .source-select{
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--card);
    padding:0 10px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    cursor:pointer;
    height:32px;
  }
  .source-select:focus{ outline:none; border-color:var(--teal); }

  .search-input{
    border:1px solid var(--line);
    border-radius:7px;
    background:var(--card);
    padding:0 10px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink);
    height:32px;
    width:220px;
    max-width:100%;
  }
  .search-input:focus{ outline:none; border-color:var(--teal); }
  .search-input::placeholder{ color:var(--muted); }

  /* ---- work summary ---- */
  .summary-section{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:22px;
  }
  .summary-col{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
  }
  .summary-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
  }
  .summary-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:14.5px;
    margin:0;
  }
  .summary-range{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
  }
  .summary-list{ display:flex; flex-direction:column; gap:8px; }
  .summary-empty{
    color:var(--muted);
    font-size:12.5px;
    text-align:center;
    padding:18px 0;
  }
  .summary-item{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:5px 8px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 10px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .summary-item:hover{ border-color:var(--teal); background:var(--low-bg); }
  .summary-item .dot{
    flex-shrink:0;
    width:8px; height:8px;
    border-radius:50%;
  }
  .summary-item .dot.dot-top{ background:var(--red); }
  .summary-item .dot.dot-high{ background:var(--amber); }
  .summary-item .dot.dot-normal{ background:var(--teal); }
  .summary-item .dot.dot-note{ background:var(--muted); }
  .summary-item .si-title{
    flex:1 1 100%;
    min-width:0;
    font-size:13px;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    margin-left:2px;
  }
  .summary-item .si-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:5px;
    flex:1 1 auto;
    min-width:0;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
  }
  .summary-item .si-date{ white-space:nowrap; }
  .summary-item .si-deadline{ white-space:nowrap; }
  .summary-item .si-actions{ display:flex; gap:4px; flex-shrink:0; margin-left:auto; }
  .summary-item .si-actions button{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    padding:4px 8px;
    font-size:10.5px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .summary-item .si-actions .done-btn:hover{ background:var(--low-bg); border-color:var(--teal); color:var(--teal-deep); }
  .summary-item .si-actions .hold-btn:hover{ background:var(--hold-bg); border-color:var(--hold-line); color:var(--hold-text); }
  .summary-item .si-actions .edit-btn:hover{ background:#EEF0FB; border-color:#4A4FB0; color:#4A4FB0; }
  .summary-item.is-hold{ border-color:var(--hold-line); background:var(--hold-bg); }


  .overdue-group{ margin-bottom:14px; }
  .overdue-group:last-child{ margin-bottom:0; }
  .og-head{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:8px;
    padding-bottom:6px;
    border-bottom:1px dashed var(--line);
  }
  .og-head .og-count{
    background:var(--red-bg);
    color:var(--red);
    font-weight:700;
    border-radius:20px;
    padding:1px 8px;
    font-size:10.5px;
  }
  .og-list{ display:flex; flex-direction:column; gap:8px; }

  .empty{
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:60px 20px;
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
  }
  .empty .big{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .cards{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    display:grid;
    grid-template-columns:5px 1fr auto;
    gap:16px;
    align-items:start;
    position:relative;
  }
  .card .stripe{
    align-self:stretch;
    border-radius:4px;
    background:var(--low-bg);
  }
  .card.u-top .stripe{ background:var(--red); }
  .card.u-high .stripe{ background:var(--amber); }
  .card.u-normal .stripe{ background:var(--teal); }
  .card.u-note .stripe{ background:var(--note-line); }

  .card.done{ opacity:0.55; }
  .card.done .title{ text-decoration:line-through; color:var(--muted); }
  .card.hold{ background:var(--hold-bg); }
  .card.hold .stripe{ background:var(--hold-text); }

  /* completed items in list view: playful instead of dimmed */
  .card.done-playful{ opacity:1; background:var(--card); }
  .card.done-playful .stripe{ background:linear-gradient(180deg, var(--teal), #7FB8A6); }
  .card.done-playful .title{ text-decoration:none; color:var(--ink); }
  .done-pill{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:#F5E6EB;
    color:#A6607A;
    border-radius:20px;
    padding:2px 10px;
    font-size:11.5px;
    font-weight:700;
    font-family:'IBM Plex Mono',monospace;
    margin-right:8px;
    vertical-align:middle;
    animation:done-pop .35s ease;
  }
  @keyframes done-pop{
    0%{ transform:scale(0.7); opacity:0; }
    60%{ transform:scale(1.08); opacity:1; }
    100%{ transform:scale(1); }
  }

  .card .body{ min-width:0; }
  .title{
    font-size:14.5px;
    font-weight:600;
    margin:0 0 6px;
    word-break:break-word;
  }
  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    align-items:center;
  }
  .meta .tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:2px 8px;
    border-radius:20px;
    font-weight:600;
    border:1px solid var(--line);
  }
  .tag.u-top{ background:var(--red-bg); color:var(--red); border-color:transparent; }
  .tag.u-high{ background:var(--amber-bg); color:#8a6415; border-color:transparent; }
  .tag.u-normal{ background:var(--low-bg); color:var(--teal-deep); border-color:transparent; }
  .tag.u-note{ background:var(--note-bg); color:var(--note-text); border-color:transparent; }
  .meta .source{
    padding:2px 8px;
    border-radius:20px;
    background:#EEF0FB;
    color:#4A4FB0;
    font-weight:600;
  }
  .meta .category{
    padding:2px 8px;
    border-radius:20px;
    background:#FDEDF3;
    color:#B0397A;
    font-weight:600;
  }
  .meta .complete-note{
    flex-basis:100%;
    display:block;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:12px;
    background:var(--low-bg);
    border-radius:8px;
    padding:6px 10px;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .badge{
    padding:2px 9px;
    border-radius:20px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .badge.overdue{ background:var(--red); color:#fff; }
  .badge.soon{ background:var(--amber); color:#4a3510; }
  .badge.ok{ background:var(--low-bg); color:var(--ink-soft); }
  .badge.unlimited{ background:var(--note-bg); color:var(--note-text); }
  .badge.hold{ background:var(--hold-bg); color:var(--hold-text); }

  .actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    align-self:center;
  }
  .actions button{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    padding:6px 12px;
    font-size:11.5px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .actions .done-btn:hover{ background:var(--low-bg); border-color:var(--teal); color:var(--teal-deep); }
  .actions .hold-btn:hover{ background:var(--hold-bg); border-color:var(--hold-line); color:var(--hold-text); }
  .actions .hold-btn.active{ background:var(--hold-bg); border-color:var(--hold-line); color:var(--hold-text); }
  .actions .edit-btn:hover{ background:#EEF0FB; border-color:#4A4FB0; color:#4A4FB0; }
  .actions .del-btn:hover{ background:var(--red-bg); border-color:var(--red); color:var(--red); }

  /* ---- calendar ---- */

  /* compact legend blended directly into a field, instead of a standalone card */
  .field-legend{
    display:flex;
    flex-wrap:wrap;
    gap:6px 12px;
    margin-top:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
  }
  .field-legend .legend-item{ display:inline-flex; align-items:center; gap:4px; }
  .field-legend .swatch{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .field-legend .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .field-legend .swatch.cat-leave{ background:#E4EEFC; }
  .field-legend .swatch.cat-meeting{ background:#F1E9FB; }
  .field-legend .swatch.cat-trip{ background:var(--amber-bg); }
  .field-legend .swatch.cat-legal{ background:#FDEDF3; }
  .field-legend .swatch.cat-none{ background:var(--low-bg); }
  .field-legend .dot.dot-top{ background:var(--red); }
  .field-legend .dot.dot-high{ background:var(--amber); }
  .field-legend .dot.dot-normal{ background:var(--teal); }
  .field-legend .dot.dot-note{ background:var(--muted); }


  .unscheduled-bar{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    width:100%;
  }
  .unscheduled-bar .chip{
    cursor:pointer;
    font-size:13px;
    padding:6px 12px;
    border-radius:7px;
    width:100%;
    box-sizing:border-box;
  }

  .cal-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
  }
  .cal-nav .label{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
    min-width:150px;
  }
  .cal-select{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    height:30px;
    padding:0 8px;
    font-family:'Space Grotesk',sans-serif;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
  }
  .cal-select:hover{ background:var(--low-bg); }
  .cal-select:focus{ outline:none; border-color:var(--teal); }
  .nav-btn{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    width:30px; height:30px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .nav-btn:hover{ background:var(--low-bg); }
  .today-btn{
    width:auto;
    padding:0 12px;
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
    margin-left:auto;
  }

  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:6px;
  }
  .cal-weekdays span{
    text-align:center;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--muted);
    padding-bottom:4px;
  }
  .cal-weekdays span.sun{ color:var(--muted); }
  .cal-weekdays span.sat{ color:var(--muted); }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:118px;
    gap:6px;
  }
  .cal-day{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px;
    height:118px;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:0;
  }
  .cal-day.has-tasks{ cursor:pointer; }
  .cal-day.has-tasks:hover{ border-color:var(--teal); }
  .cal-day.other-month{ opacity:0.38; }
  .cal-day.sun{ background:var(--weekend-bg); }
  .cal-day.sat{ background:var(--weekend-bg); }
  .cal-day.today{ border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset; }
  .cal-day .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .cal-day.today .num{ color:var(--teal-deep); }

  .chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:10.5px;
    padding:2px 6px;
    border-radius:5px;
    max-width:100%;
    flex-shrink:0;
    font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }
  .chip .dot{
    flex-shrink:0;
    width:7px;
    height:7px;
    border-radius:50%;
    display:inline-block;
  }
  .chip .dot.dot-top{ background:var(--red); }
  .chip .dot.dot-high{ background:var(--amber); }
  .chip .dot.dot-normal{ background:var(--teal); }
  .chip .dot.dot-note{ background:var(--muted); }
  .chip .label-text{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* chip background/color now reflects work category, not urgency */
  .chip.cat-leave{ background:#E4EEFC; color:#2A5FA8; }
  .chip.cat-meeting{ background:#F1E9FB; color:#6B3FA0; }
  .chip.cat-trip{ background:var(--amber-bg); color:#8a6415; }
  .chip.cat-legal{ background:#FDEDF3; color:#B0397A; }
  .chip.cat-none{ background:var(--low-bg); color:var(--teal-deep); }
  .chip.cat-loan{ background:#DCEEF5; color:#1B6E8C; }
  .chip.done{ text-decoration:line-through; opacity:0.55; }
  .chip.chip-deadline{ font-weight:700; box-shadow:0 0 0 1px var(--red) inset; }
  .chip.chip-completed{ font-weight:700; box-shadow:0 0 0 1px var(--teal) inset; }
  .more-link{
    font-size:10px;
    color:var(--muted);
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
  }
  .more-link:hover{ color:var(--teal-deep); }

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(28,35,51,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-box{
    background:var(--card);
    border-radius:12px;
    max-width:560px;
    width:100%;
    max-height:82vh;
    overflow-y:auto;
    padding:22px;
  }
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .modal-head h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    margin:0;
  }
  .modal-close{
    border:1px solid var(--line);
    background:var(--card);
    border-radius:6px;
    width:28px; height:28px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .modal-close:hover{ background:var(--low-bg); }
  .modal-box .cards{ gap:10px; }
  .modal-empty{ color:var(--muted); font-size:13px; text-align:center; padding:20px 0; }

  .complete-modal-box{ max-width:420px; }
  .complete-modal-box .field{ margin-bottom:14px; }
  .complete-modal-actions{
    display:flex;
    gap:10px;
    margin-top:4px;
  }
  .complete-modal-actions .cancel-edit-btn{ margin-top:0; }
  .complete-modal-actions button{ flex:1; }

  /* ---- contract loan feature ---- */
  .loan-card.status-overdue .stripe{ background:var(--red); }
  .loan-card.status-soon .stripe{ background:var(--amber); }
  .loan-card.status-borrowed .stripe{ background:var(--teal); }
  .loan-card.status-unlimited .stripe{ background:var(--note-line); }
  .loan-card.status-returned{ opacity:0.6; }
  .loan-card.status-returned .stripe{ background:var(--note-line); }
  .loan-card.status-returned .title{ text-decoration:line-through; color:var(--muted); }

  /* returned loans in list view: playful pill instead of dimmed/strikethrough,
     matching how completed work items are shown in the list view */
  .loan-card.done-playful{ opacity:1; background:var(--card); }
  .loan-card.done-playful .stripe{ background:linear-gradient(180deg, #1B6E8C, #78BFD6); }
  .loan-card.done-playful .title{ text-decoration:none; color:var(--ink); }
  .returned-pill{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:#DCEEF5;
    color:#1B6E8C;
    border-radius:20px;
    padding:2px 10px;
    font-size:11.5px;
    font-weight:700;
    font-family:'IBM Plex Mono',monospace;
    margin-right:8px;
    vertical-align:middle;
    animation:done-pop .35s ease;
  }

  .badge.returned{ background:var(--low-bg); color:var(--teal-deep); }

  @media (max-width:880px){
    .layout{ grid-template-columns:1fr; }
    .summary-sidebar{
      position:static;
      height:auto;
      border-right:none;
      border-bottom:1px solid var(--line);
    }
    .summary-sidebar-right{
      position:static;
      height:auto;
      border-left:none;
      border-top:1px solid var(--line);
      order:3;
    }
    .summary-item{ flex-wrap:wrap; }
    .card{
      grid-template-columns:5px 1fr;
    }
    .actions{
      grid-column:1 / -1;
      flex-direction:row;
      justify-content:flex-end;
      margin-top:8px;
    }
    .stat-strip{ display:none; }
    .cal-grid{ grid-auto-rows:80px; }
    .cal-day{ height:80px; padding:5px; }
    .chip{ font-size:9.5px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark"></span>INA-working schedule💣</div>
  <div class="stat-strip">
    <div class="stat"><b id="statTotal">0</b>總計</div>
    <div class="stat"><b id="statActive">0</b>進行中</div>
    <div class="stat"><b id="statHold">0</b>暫緩</div>
    <div class="stat warn"><b id="statOverdue">0</b>已逾期</div>
  </div>
</div>

<!-- add / edit task modal -->
<div class="modal-overlay" id="taskModalOverlay" style="display:none;">
  <div class="modal-box task-modal-box panel">
    <div class="modal-head">
      <div>
        <h2 id="formTitle" style="margin:0 0 4px;">新增工作</h2>
        <p class="hint" id="formHint" style="margin:0;">填寫後按下方按鈕加入清單</p>
      </div>
      <button type="button" class="modal-close" id="taskModalClose">✕</button>
    </div>

    <form id="taskForm">
      <div class="field">
        <label for="title">工作名稱 / 內容說明</label>
        <textarea id="title" required placeholder="例：完成 Q3 財報彙整"></textarea>
      </div>

      <div class="field">
        <label for="source">工作來源</label>
        <input type="text" id="source" placeholder="例：主管指派、客戶來信、系統派工">
      </div>

      <div class="field">
        <label for="progress">進度說明</label>
        <textarea id="progress" placeholder="例：已完成初稿，待主管確認"></textarea>
      </div>

      <div class="field">
        <label for="category">工作類別</label>
        <select id="category">
          <option value="">其他</option>
          <option value="請假">請假</option>
          <option value="會議">會議</option>
          <option value="公差">公差</option>
          <option value="法務">法務</option>
        </select>
        <div class="field-legend">
          <span class="legend-item"><span class="swatch cat-leave"></span>請假</span>
          <span class="legend-item"><span class="swatch cat-meeting"></span>會議</span>
          <span class="legend-item"><span class="swatch cat-trip"></span>公差</span>
          <span class="legend-item"><span class="swatch cat-legal"></span>法務</span>
          <span class="legend-item"><span class="swatch cat-none"></span>其他</span>
        </div>
      </div>

      <div class="field">
        <label for="received" id="receivedLabel">收到工作的日期</label>
        <div class="row">
          <input type="date" id="received" required>
          <button type="button" id="nowBtn">今天</button>
        </div>
      </div>

      <div class="field" id="urgencyField">
        <label>緊急程度</label>
        <div class="urgency-picker">
          <input type="radio" name="urgency" id="u-top" value="top">
          <label class="u-top" for="u-top">最急件</label>
          <input type="radio" name="urgency" id="u-high" value="high">
          <label class="u-high" for="u-high">急件</label>
          <input type="radio" name="urgency" id="u-normal" value="normal" checked>
          <label class="u-normal" for="u-normal">普通件</label>
          <input type="radio" name="urgency" id="u-note" value="note">
          <label class="u-note" for="u-note">備註</label>
        </div>
        <div class="field-legend">
          <span class="legend-item"><span class="dot dot-top"></span>最急件</span>
          <span class="legend-item"><span class="dot dot-high"></span>急件</span>
          <span class="legend-item"><span class="dot dot-normal"></span>普通件</span>
          <span class="legend-item"><span class="dot dot-note"></span>備註</span>
        </div>
      </div>

      <div class="field" id="deadlineField">
        <label for="deadline">結案日期</label>
        <div class="row">
          <input type="date" id="deadline" required>
          <label class="unlimited-toggle"><input type="checkbox" id="deadlineUnlimited"> 不限</label>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">加入工作清單</button>
      <button type="button" class="cancel-edit-btn" id="cancelEditBtn" style="display:none;">取消編輯</button>
    </form>
  </div>
</div>

<div class="layout" id="scheduleView">
  <!-- SUMMARY SIDEBAR -->
  <div class="summary-sidebar">
    <div class="summary-section">
      <div class="summary-col">
        <div class="summary-head">
          <h2>本週待辦工作</h2>
          <span class="summary-range" id="thisWeekRange"></span>
        </div>
        <div class="summary-list" id="thisWeekList"></div>
      </div>
      <div class="summary-col">
        <div class="summary-head">
          <h2>未完成的工作項目</h2>
          <span class="summary-range">過去週數</span>
        </div>
        <div class="summary-groups" id="overdueGroups"></div>
      </div>
      <div class="summary-col">
        <div class="summary-head">
          <h2>暫緩中的工作項目</h2>
        </div>
        <div class="summary-list" id="onHoldList"></div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="list-head">
      <h1>所有工作</h1>
      <div class="controls-top">
        <input type="search" id="searchInput" class="search-input" placeholder="🔍 搜尋工作名稱或來源">
        <div class="seg view-seg" id="viewSeg">
          <button data-view="calendar" class="active">📅 日曆檢視</button>
          <button data-view="list">📋 清單檢視</button>
        </div>
        <button type="button" class="add-task-btn" id="openAddTaskBtn">＋ 新增工作</button>
        <button type="button" class="add-task-btn loan-btn" id="openAddLoanBtn">＋ 新增合約</button>
      </div>
    </div>

    <div class="filter-bar" id="filterBar">
      <div class="filter-group">
        <span class="filter-label">類別</span>
        <select id="categoryFilterSelect" class="source-select"></select>
      </div>
      <div class="filter-group">
        <span class="filter-label">狀態</span>
        <select id="statusFilterSelect" class="source-select">
          <option value="active">進行中</option>
          <option value="all" selected>全部</option>
          <option value="hold">暫緩</option>
          <option value="done">已完成</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">緊急度</span>
        <select id="urgencyFilterSelect" class="source-select">
          <option value="all" selected>全部</option>
          <option value="top">最急件</option>
          <option value="high">急件</option>
          <option value="normal">普通件</option>
          <option value="note">備註</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">來源</span>
        <select id="sourceFilter" class="source-select">
          <option value="all">全部來源</option>
        </select>
      </div>
      <button type="button" class="filter-reset" id="filterResetBtn" style="display:none;">✕ 清除篩選</button>
    </div>
    <div class="filter-summary" id="filterSummary"></div>

    <!-- calendar view -->
    <div id="calendarWrap">
      <div class="cal-nav">
        <select class="cal-select" id="calYearSelect"></select>
        <select class="cal-select" id="calMonthSelect"></select>
        <button class="nav-btn today-btn" id="calToday">今天</button>
      </div>

      <div id="monthView">
        <div class="cal-weekdays">
          <span class="sun">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="sat">六</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>

    <!-- list view: flat, scannable list of everything the current filters match -->
    <div id="listViewWrap" style="display:none;">
      <div class="list-view-toolbar">
        <span class="list-view-count" id="listViewCount"></span>
        <select class="source-select" id="listSortSelect">
          <option value="deadline">依結案日期排序</option>
          <option value="received">依收到日期排序</option>
          <option value="urgency">依緊急度排序</option>
        </select>
      </div>
      <div class="cards" id="taskCards"></div>
      <div class="empty" id="taskCardsEmpty" style="display:none;">
        <div class="big">找不到符合條件的工作</div>
        目前的篩選條件下沒有工作項目，試試清除篩選或切換類別
      </div>
    </div>
  </div>

  <!-- RIGHT SIDEBAR -->
  <div class="summary-sidebar-right">
    <div class="summary-section">
      <div class="summary-col">
        <div class="summary-head">
          <h2>本週會議事項</h2>
          <span class="summary-range" id="thisWeekMeetingRange"></span>
        </div>
        <div class="summary-list" id="thisWeekMeetingList"></div>
      </div>
      <div class="summary-col">
        <div class="summary-head">
          <h2>本週出差</h2>
          <span class="summary-range" id="thisWeekTripRange"></span>
        </div>
        <div class="summary-list" id="thisWeekTripList"></div>
      </div>
      <div class="summary-col">
        <div class="summary-head">
          <h2>合約借閱</h2>
          <span class="summary-range" id="loanSidebarRange"></span>
        </div>
        <div class="summary-list" id="loanSidebarList"></div>
      </div>
    </div>
  </div>
</div>

<!-- add / edit contract loan modal -->
<div class="modal-overlay" id="loanModalOverlay" style="display:none;">
  <div class="modal-box task-modal-box panel">
    <div class="modal-head">
      <div>
        <h2 id="loanFormTitle" style="margin:0 0 4px;">新增借閱紀錄</h2>
        <p class="hint" style="margin:0;">填寫合約正本借出資訊，歸還後可標記為已歸還</p>
      </div>
      <button type="button" class="modal-close" id="loanModalClose">✕</button>
    </div>

    <form id="loanForm">
      <div class="field">
        <label for="loanContractName">合約名稱／編號</label>
        <input type="text" id="loanContractName" required placeholder="例：114年度辦公室租賃合約">
      </div>

      <div class="field">
        <label for="loanBorrower">借閱人</label>
        <input type="text" id="loanBorrower" required placeholder="例：王小明">
      </div>

      <div class="field">
        <label for="loanDepartment">借閱單位／部門</label>
        <input type="text" id="loanDepartment" placeholder="例：法務室">
      </div>

      <div class="field">
        <label for="loanDate">借出日期</label>
        <div class="row">
          <input type="date" id="loanDate" required>
          <button type="button" id="loanNowBtn">今天</button>
        </div>
      </div>

      <div class="field" id="loanExpectedField">
        <label for="loanExpectedReturn">預計歸還日期</label>
        <div class="row">
          <input type="date" id="loanExpectedReturn">
          <label class="unlimited-toggle"><input type="checkbox" id="loanExpectedUnlimited"> 未定</label>
        </div>
      </div>

      <div class="field">
        <label for="loanPurpose">借閱事由</label>
        <textarea id="loanPurpose" placeholder="例：提供會計師查核用"></textarea>
      </div>

      <div class="field">
        <label for="loanNote">備註</label>
        <textarea id="loanNote" placeholder="補充說明..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="loanSubmitBtn">新增借閱紀錄</button>
      <button type="button" class="cancel-edit-btn" id="loanCancelEditBtn" style="display:none;">取消編輯</button>
    </form>
  </div>
</div>

<!-- mark loan as returned modal -->
<div class="modal-overlay" id="loanReturnModalOverlay" style="display:none;">
  <div class="modal-box complete-modal-box">
    <div class="modal-head">
      <h3>標記歸還</h3>
      <button class="modal-close" id="loanReturnModalClose">✕</button>
    </div>
    <form id="loanReturnForm">
      <div class="field">
        <label for="loanReturnDate">實際歸還日期</label>
        <input type="date" id="loanReturnDate" required>
      </div>
      <div class="field">
        <label for="loanReturnNote">說明欄（選填）</label>
        <textarea id="loanReturnNote" placeholder="補充說明，例如經手人、狀況..."></textarea>
      </div>
      <div class="complete-modal-actions">
        <button type="button" class="cancel-edit-btn" id="loanReturnCancelBtn">取消</button>
        <button type="submit" class="submit-btn">確認歸還</button>
      </div>
    </form>
  </div>
</div>

<!-- day detail modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="cards" id="modalCards"></div>
  </div>
</div>

<!-- work item detail modal (opened by clicking an item in the sidebar summary lists) -->
<div class="modal-overlay" id="itemDetailModalOverlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="itemDetailTitle">工作項目詳情</h3>
      <button class="modal-close" id="itemDetailModalClose">✕</button>
    </div>

  // Some fields (category / completed_at / complete_note) are newer additions.
  // If the Supabase table hasn't had those columns added yet, PostgREST returns
  // an "unknown column" error. Rather than failing the whole save, we detect
  // that specific error, drop the offending column from the payload, and retry
  // — so core fields still save even before the table is migrated.
  function extractMissingColumn(error){
    if(!error || !error.message) return null;
    const m = /Could not find the '([\w]+)' column/i.exec(error.message)
      || /column "?([\w]+)"? .*does not exist/i.exec(error.message);
    return m ? m[1] : null;
  }
  async function resilientWrite(table, kind, payload, id){
    let body = { ...payload };
    let missingCols = [];
    for(let attempt=0; attempt<6; attempt++){
      const query = kind === 'insert'
        ? sb.from(table).insert(body)
        : sb.from(table).update(body).eq('id', id);
      const { error } = await query;
      if(!error) return { error:null, missingCols };
      const col = extractMissingColumn(error);
      if(col && col in body){
        delete body[col];
        missingCols.push(col);
        continue;
      }
      return { error, missingCols };
    }
    return { error:new Error('儲存失敗，欄位不符'), missingCols };
  }

      });
